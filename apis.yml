name: SenseTime
description: 'SenseTime (商汤科技) is a Shanghai-headquartered artificial-intelligence
  company building foundation models, AI compute infrastructure, and vision AI. Its
  developer-facing surface is the SenseNova LLM API service platform, which exposes
  large multimodal models (SenseNova U-series, SenseNova 6.x) for text, image, and
  video understanding, reasoning, and generation via an HTTP API. Developers authenticate
  with an Access Key ID / Secret Access Key pair (with OAuth2/OIDC available through
  SenseCore signin), call chat-completions, embeddings, and fine-tuning endpoints,
  and integrate with an official Python client library and CLI. SenseTime also operates
  SenseCore AI infrastructure, SenseFoundry vision AI, and native applications. This
  profile was surfaced as a Tiger Global portfolio company and enriched from public
  developer sources.'
